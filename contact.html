<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ethylox-logo.png">
    <meta name="description" content="Contact Ethylox Trading International Corporation for orders and medical supply inquiries.">
    <title>Contact Us | Ethylox Trading International Corporation</title>
  
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Contact ETHYLOX EQUIPMENT CORPORATION">
    <meta property="og:description" content="For product inquiries, orders, and availability. Contact our sales team in the Philippines or California, USA.">
    <meta property="og:image" content="https://ethylox.jparaiso-digital.workers.dev/assets/og-image.png">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ethylox.jparaiso-digital.workers.dev">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact ETHYLOX EQUIPMENT CORPORATION">
    <meta name="twitter:description" content="For product inquiries, orders, and availability. Contact our sales team.">
    <meta name="twitter:image" content="https://ethylox.jparaiso-digital.workers.dev/assets/og-image.png">
  
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="site.js" defer></script>
  </head>

<body data-page="contact">
  <header class="site-header">
    <div class="container header-inner">
      <!-- Logo (Left) -->
      <a class="brand" href="index.html" aria-label="Ethylox home">
        <img data-image="brand.logo" alt="">
        <span data-text="brand.name"></span>
      </a>

      <!-- Right Side Group (Nav + Email) -->
      <div class="header-right-group">
        
        <!-- Desktop Navigation -->
        <nav class="nav desktop-nav" aria-label="Main navigation">
          <a href="index.html#products" data-text="navigation.products"></a>
          <a href="index.html#overview" data-text="navigation.company"></a>
          <a href="contact.html" data-text="navigation.contact"></a>
        </nav>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div class="mobile-nav-dropdown">
      <nav class="mobile-nav">
        <a href="index.html#products">Products</a>
        <a href="index.html#overview">Our Company</a>
        <a href="contact.html">Contact</a>
        <a class="mobile-email-btn" href="contact.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Email Us</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="contact-main">
    <div class="container">
      <p class="eyebrow" data-text="contact.eyebrow"></p>
      <h1 data-text="contact.heading"></h1>
      <p class="contact-intro" data-text="contact.intro"></p>

      <div class="contact-grid">
        <section class="contact-card"
                 aria-labelledby="ph-heading"
                 data-office="ph">
          <p class="card-label" data-text="contact.offices.ph.label"></p>
          <h2 id="ph-heading"
              data-text="contact.offices.ph.heading"></h2>
          <div class="office-details"></div>
        </section>

        <section class="contact-card"
                 aria-labelledby="us-heading"
                 data-office="us">
          <p class="card-label" data-text="contact.offices.us.label"></p>
          <h2 id="us-heading"
              data-text="contact.offices.us.heading"></h2>
          <div class="office-details"></div>
        </section>
      </div>

      <section class="email-panel" aria-labelledby="email-heading">
        <div>
          <h2 id="email-heading"
              data-text="contact.emailPanel.heading"></h2>
          <p data-text="contact.emailPanel.description"></p>
        </div>

        <a class="button"
           data-email-link
           data-text="contact.emailPanel.button"></a>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p class="footer-buyback">
        <span data-text="home.buyback.text"></span>
        <a data-email-link data-email-subject="home.buyback.emailSubject" data-text="home.buyback.linkText"></a>
      </p>
      © <span data-text="brand.fullName"></span>
    </div>
  </footer>

    <!-- Page Loading Overlay -->
    <div id="page-loader" class="page-loader">
      <img src="assets/ethylox-logo.png" alt="Ethylox Loading" class="loader-logo">
    </div>

</body>
</html>
