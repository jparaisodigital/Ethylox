<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/ethylox-logo.png">
    <meta name="description" content="Ethylox Trading International Corporation — medical supplies and surgical sutures.">
    <title>Ethylox Trading International Corporation</title>
  
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="ETHYLOX EQUIPMENT CORPORATION - Surplus US Medical Supplies">
    <meta property="og:description" content="Surgical sutures and medical supplies for clinics, hospitals, and distributors. Established 1978.">
    <meta property="og:image" content="https://ethylox.jparaiso-digital.workers.dev/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ethylox.jparaiso-digital.workers.dev">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ETHYLOX EQUIPMENT CORPORATION - Surplus US Medical Supplies">
    <meta name="twitter:description" content="Surgical sutures and medical supplies for clinics, hospitals, and distributors.">
    <meta name="twitter:image" content="https://ethylox.jparaiso-digital.workers.dev/assets/og-image.png">
  
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="site.js" defer></script>
  </head>

<body data-page="home">
  <header class="site-header">
    <div class="container header-inner">
      <!-- Logo (Left) -->
      <a class="brand" href="index.html" aria-label="Ethylox home">
        <img data-image="brand.logo" alt="">
        <span data-text="brand.name"></span>
      </a>

      <!-- Right Side Group (Nav + Email) -->
      <div class="header-right-group">
        
        <!-- Desktop Navigation -->
        <nav class="nav desktop-nav" aria-label="Main navigation">
          <a href="index.html#products" data-text="navigation.products"></a>
          <a href="index.html#overview" data-text="navigation.company"></a>
          <a href="contact.html" data-text="navigation.contact"></a>
        </nav>

        <!-- Desktop Email Button -->
        <a class="header-email-btn" href="contact.html" aria-label="Contact Us">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </a>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div class="mobile-nav-dropdown">
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="index.html#products" data-text="navigation.products"></a>
        <a href="index.html#overview" data-text="navigation.company"></a>
        <a href="contact.html" data-text="navigation.contact"></a>
        <a class="mobile-email-btn" href="contact.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Email Us</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="home-main">

    <!-- 1. HERO SECTION -->
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-content">
          <p class="eyebrow" data-text="home.hero.eyebrow"></p>
          <h1 data-text="home.hero.heading"></h1>
          <p class="hero-copy" data-text="home.hero.description"></p>

          <div class="actions">
            <a class="button button-dark" href="#products" data-text="home.hero.productButton"></a>
            <a class="button button-light" href="#contact" data-text="home.hero.contactButton"></a>
          </div>

          <div class="hero-facts" aria-label="Company information">
            <div class="hero-fact">
              <strong data-text="home.hero.establishedValue"></strong>
              <span data-text="home.hero.establishedLabel"></span>
            </div>
            <div class="hero-fact">
              <strong data-text="home.hero.officeValue"></strong>
              <span data-text="home.hero.officeLabel"></span>
            </div>
          </div>
        </div>

        <div class="hero-art" aria-hidden="true">
          <div class="hero-logo-stage">
            <img data-image="brand.logo" alt="">
          </div>
          <span class="hero-art-label" data-text="brand.fullName"></span>
        </div>
      </div>
    </section>

    <!-- 2. PRODUCT GALLERY -->
    <section class="showcase" aria-labelledby="showcase-title">
      <div class="container">
        <div class="showcase-heading">
          <p class="eyebrow" data-text="home.gallery.eyebrow"></p>
          <h2 id="showcase-title" data-text="home.gallery.heading"></h2>
          <p class="gallery-desc-desktop" data-text="home.gallery.description"></p>
          <p class="gallery-desc-mobile" data-text="home.gallery.descriptionMobile"></p>
        </div>
        <div class="showcase-grid" id="showcase-grid"></div>
      </div>
    </section>

    <!-- 3. PRODUCT CATEGORIES -->
    <section class="products" id="products">
      <div class="container">
        <div class="section-heading">
          <h2 data-text="home.productSection.heading"></h2>
          <p data-text="home.productSection.description"></p>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </section>

    <!-- 4. ABOUT ETHYLOX (OVERVIEW) --->
    <section class="overview" id="overview">
      <div class="container">
        <div class="overview-grid">

                 <!-- LEFT SIDE: Sticky Text + Clean Image -->
                 <div class="overview-left-panel">
                  <div class="overview-sticky-text">
                    <p class="eyebrow" data-text="home.company.eyebrow"></p>
                    <h2 data-text="home.company.heading"></h2>
                  </div>
                  <div class="overview-image-container">
                    <img src="assets/ethylox-logo.png" alt="Ethylox Logo">
                  </div>
                </div>

          <!-- RIGHT SIDE: Content -->
          <div class="overview-content">
            <div id="company-paragraphs"></div>
            <div id="company-values" class="values-grid-integrated"></div>
          </div>

        </div>
      </div>
    </section>

    <!-- 5. CONTACT CTA -->
    <section class="home-contact" id="contact" aria-labelledby="contact-heading">
      <div class="container inquiry-layout">
        <div class="inquiry-copy">
          <p class="eyebrow" data-text="home.contactCta.eyebrow"></p>
          <h2 id="contact-heading" data-text="home.contactCta.heading"></h2>
          <p data-text="home.contactCta.description"></p>
          <a class="button" data-email-link data-text="home.contactCta.button"></a>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <p class="footer-buyback">
        <span data-text="home.buyback.text"></span>
        <a data-email-link data-email-subject="home.buyback.emailSubject" data-text="home.buyback.linkText"></a>
      </p>
      © <span data-text="brand.fullName"></span>
    </div>
  </footer>

<div id="image-modal" class="image-modal" aria-hidden="true">
  <div class="modal-content">
    <button class="modal-close" aria-label="Close image">&times;</button>
    <img src="" alt="" id="modal-image">
  </div>
</div>

  <!-- Page Loading Overlay -->
  <div id="page-loader" class="page-loader">
    <img src="assets/ds.png" alt="Ethylox Loading" class="loader-logo">
  </div>

</body>
</html>
